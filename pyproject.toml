[project]
name = "rumia-configurator"
dynamic = ["version"]
description = "Desktop configurator for Rumia CANopen products and generic CANopen nodes."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Rumia" }]
dependencies = [
    "pyside6>=6.7",
    "pyqtgraph>=0.13.7",
    "canopen>=2.3",
    "python-can>=4.4",
    "pyserial>=3.5",
    "numpy>=2.0",
    "scipy>=1.14",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "platformdirs>=4.2",
]

[project.urls]
Homepage = "https://rumia.it"

[project.scripts]
rumia-configurator = "rumia_configurator.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-qt>=4.4",
    "ruff>=0.6",
    "mypy>=1.11",
    "pyinstaller>=6.10",
    "pip-licenses>=5.0",
    "types-pyyaml>=6.0",
    "pillow>=10.4",
    "pathspec>=0.12",
    "types-pyserial>=3.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/rumia_configurator/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/rumia_configurator"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "N",   # pep8-naming
    "RUF", # ruff-specific rules
]

[tool.ruff.format]

[tool.mypy]
python_version = "3.12"
files = ["src"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["rumia_configurator.core", "rumia_configurator.core.*"]
strict = true

[[tool.mypy.overrides]]
# canopen ships type hints, but LocalNode, NmtSlave and SdoServer are partly untyped.
module = [
    "rumia_configurator.core.simulator.*",
    "rumia_configurator.core.network.*",
    "rumia_configurator.profiles.*",
]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["pyqtgraph","pyqtgraph.*", "canopen", "canopen.*", "scipy", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
xfail_strict = true
qt_api = "pyside6"
