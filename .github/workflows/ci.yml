# Code quality checks (BLD-02, BLD-03, NFR-MNT-02).
# Push and pull request: Ubuntu 22.04 only.
# Version tags and manual runs: full matrix Windows / Ubuntu 22.04 / macOS (Apple Silicon).
name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && '["ubuntu-22.04", "windows-latest", "macos-14"]' || '["ubuntu-22.04"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install system libraries for Qt
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src

      - name: Pytest
        run: uv run pytest
